services:
  _defaults:
    autowire: true
    autoconfigure: true
  IptvService\:
    resource: '../src/'
    exclude: '../src/{Kernel.php,Import/XtreamClient.php}'
  Doctrine\DBAL\Connection:
    factory: ['Doctrine\DBAL\DriverManager', 'getConnection']
    arguments:
      - { driver: 'pdo_pgsql', url: '%env(DATABASE_URL)%' }
