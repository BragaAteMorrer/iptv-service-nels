name: NSatellite quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    name: Browser syntax and session regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static PC/TV pages
        run: node tests/check_static_pages.mjs
      - name: Test browser session client
        run: node --test tests/browser_auth_client.test.mjs
      - name: Test large-catalog PC/TV navigation contracts
        run: node --test tests/tv_large_catalog_contract.test.mjs
      - name: Syntax-check deployment scripts
        run: |
          bash -n deploy/o2switch/install-viewer.sh
          bash -n deploy/o2switch/install-public.sh
          bash -n deploy/o2switch/check-browser.sh
          bash -n deploy/o2switch/doctor-account.sh
      - name: Regression test for o2switch asset permissions
        run: bash tests/o2switch_asset_permissions_smoke.sh

  php:
    name: PHP and isolated security smoke tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nsatellite_ci_root_only
          MARIADB_DATABASE: nsatellite_ci
          MARIADB_USER: ci
          MARIADB_PASSWORD: nsatellite_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      NSATELLITE_CI_DB_NAME: nsatellite_ci
      NSATELLITE_CI_DB_HOST: 127.0.0.1
      NSATELLITE_CI_DB_PORT: '3306'
      NSATELLITE_CI_DB_USER: ci
      NSATELLITE_CI_DB_PASSWORD: nsatellite_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.4 with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, sodium, mbstring, xmlreader, simplexml
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Regression — public assets must be readable by Apache
        run: bash tests/o2switch_asset_permissions_smoke.sh
      - name: PHP syntax validation
        run: find src tests deploy/o2switch/public_html -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: MariaDB 11.4 live import queue claim and concurrency
        run: php tests/import_job_claim_mariadb_smoke.php
      - name: Run deterministic smoke tests against disposable DB
        run: |
          php tests/direct_hls_policy_smoke.php
          php tests/vod_production_gate_smoke.php
          php tests/o2switch_viewer_route_gate_smoke.php
          php tests/browser_session_security_smoke.php
          php tests/source_access_smoke.php
          php tests/session_lifecycle_smoke.php
          php tests/identity_workflow_smoke.php
          php tests/lineup_server_search_smoke.php
          php tests/account_sources_smoke.php
          php tests/account_source_creation_smoke.php
          php tests/account_source_formats_smoke.php
          php tests/sync_source_failure_diagnostics_smoke.php
