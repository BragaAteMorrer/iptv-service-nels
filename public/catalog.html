<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nels TV — Catalogue</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1725;color:#f1f6fe;font:15px system-ui}header{padding:22px 5%;background:#192337}main{margin:24px auto;max-width:1250px;padding:0 20px}
h1{margin:0}a{color:#73d5e7}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button,select,input{padding:11px;border-radius:9px;border:1px solid #40556f;background:#1e3149;color:#fff}
button{cursor:pointer}button.active{background:#236b7b}input{max-width:300px}.auth{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tile button{margin-top:12px}.tile button:focus-visible{outline:3px solid #7de4da}.tile .fav{color:#ffda75}.tile img{width:100%;height:150px;object-fit:contain;background:#101d2d;border-radius:7px}#tiles{align-items:stretch}@media(max-width:600px){#tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:10px}.tile img{height:110px}header{padding:14px}}#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.tile{min-height:100px;background:#1b2a40;border:1px solid #31445e;border-radius:12px;padding:16px;overflow-wrap:anywhere}.tile small{display:block;color:#b8c8d9;margin-top:8px}
#notice{margin:12px 0;color:#a5c6db}#pager{display:flex;align-items:center;gap:12px;margin:20px 0}</style><link rel="stylesheet" href="/assets/nsatellite-themes.css"><script src="/assets/nsatellite-theme.js" defer></script><script src="/assets/nsatellite-auth.js"></script></head>
<body><header><h1>Nels TV · Catalogue</h1><span><a href="/home.html">Accueil</a> · <a href="/tv.html">TV en direct</a> · <a href="/series.html">Séries</a> · <a href="/devices.html">Mes appareils</a></span></header><main>
<p>Explorateur de catalogue, sans divulguer les adresses de lecture.</p>
<div class="auth"><input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username"><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="login">Se connecter</button><button id="logout" type="button" hidden>Déconnexion</button><details><summary>Ancien accès administrateur</summary><input id="token" type="password" autocomplete="off" placeholder="Jeton admin"></details></div>
<nav><button data-kind="live" class="active">TV en direct</button><button data-kind="movie">Films</button><button data-kind="episode">Épisodes</button></nav>
<div><label><input type="checkbox" id="favs"> Mes favoris</label> <input id="q" placeholder="Rechercher un titre"><select id="group"><option value="">Toutes catégories</option></select><button id="search">Rechercher</button></div>
<p id="notice" role="status">Saisis ton jeton pour explorer le catalogue.</p><div id="tiles"></div>
<div id="pager"><button id="prev">Précédent</button><span id="page"></span><button id="next">Suivant</button></div>
<script>
'use strict';
const $=s=>document.getElementById(s);
let kind='live',page=1,total=0,limit=48,authenticated=false,requestNumber=0;
function headers(){return $('token').value?{'X-Admin-Token':$('token').value}:{};}
async function read(path){return NSatelliteAuth.json(path,{headers:headers()});}
async function groups(){const data=await read('/api/catalog/groups?kind='+kind);$('group').replaceChildren(new Option('Toutes catégories',''));for(const x of data.items)$('group').add(new Option((x.name||'Sans catégorie')+' ('+x.total+')',x.name||''));}
async function updateFavorite(id,current){await NSatelliteAuth.json('/api/v1/me/library/'+id+'/preferences',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({favorite:!current})});}
function card(item){const el=document.createElement('article');el.className='tile';if(item.logo && /^https:\/\//i.test(item.logo)){const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';img.alt='';img.src=item.logo;el.append(img);}
const title=document.createElement('strong');title.textContent=item.name;const group=document.createElement('small');group.textContent=item.group_name||'Sans catégorie';el.append(title,group);
if(authenticated){const fav=document.createElement('button');fav.className=item.favorite?'fav':'';fav.textContent=item.favorite?'★ Favori':'☆ Ajouter aux favoris';fav.setAttribute('aria-label','Favori : '+item.name);fav.onclick=async()=>{fav.disabled=true;try{await updateFavorite(item.id,!!item.favorite);item.favorite=!item.favorite;fav.textContent=item.favorite?'★ Favori':'☆ Ajouter aux favoris';fav.className=item.favorite?'fav':'';if($('favs').checked && !item.favorite)refresh();}catch(e){$('notice').textContent=e.message;}finally{fav.disabled=false;}};el.append(fav);}
if(item.kind==='live'){const watch=document.createElement('button');watch.textContent='Voir la TV';watch.onclick=()=>location.href='/tv.html?channel='+encodeURIComponent(item.id);el.append(watch);}return el;}
async function refresh(){
const serial=++requestNumber;
try{
let items=[];
if(authenticated){
 const d=await read('/api/v1/me/library?'+new URLSearchParams({kind,page,limit,q:$('q').value,group:$('group').value,favorite:$('favs').checked?'1':'0'}));
 items=d.items;total=d.total;
 $('notice').textContent=total.toLocaleString('fr-FR')+' résultats dans tout le catalogue';
 $('page').textContent='Page '+page+' / '+Math.max(1,Math.ceil(total/limit));
 $('next').disabled=page*limit>=total;
}else{
 const params=new URLSearchParams({kind,page,limit,q:$('q').value,group:$('group').value});
 const d=await read('/api/catalog/discover?'+params);items=d.items;total=d.total;
 $('notice').textContent=total.toLocaleString('fr-FR')+' résultats';
 $('page').textContent='Page '+page+' / '+Math.max(1,Math.ceil(total/limit));
 $('next').disabled=page*limit>=total;
}
if(serial!==requestNumber)return;
$('tiles').replaceChildren(...items.map(card));$('prev').disabled=page===1;
}catch(e){if(serial===requestNumber)$('notice').textContent=e.message;}
}
async function reloadKind(){page=1;try{await groups();await refresh();}catch(e){$('notice').textContent=e.message;}}
document.querySelectorAll('button[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('button[data-kind]').forEach(x=>x.classList.toggle('active',x===b));reloadKind();});
function showSession(active){
 authenticated=active;$('email').hidden=active;$('password').hidden=active;$('login').hidden=active;$('logout').hidden=!active;
 if(active)$('password').value='';
}
$('login').onclick=async()=>{
 try{
  await NSatelliteAuth.login($('email').value,$('password').value);
  showSession(true);$('notice').textContent='Compte connecté';await reloadKind();
 }catch(e){$('notice').textContent='Connexion : '+e.message;}
};
$('logout').onclick=async()=>{
 try{await NSatelliteAuth.logout();showSession(false);$('tiles').replaceChildren();$('notice').textContent='Déconnecté';}
 catch(e){$('notice').textContent='Déconnexion impossible : '+e.message;}
};
async function restoreSession(){
 try{
  if(await NSatelliteAuth.session()){showSession(true);await reloadKind();}
  else{$('notice').textContent='Connecte-toi pour explorer le catalogue.';showSession(false);}
 }catch(error){$('notice').textContent='Vérification de connexion : '+error.message;}
}
void restoreSession();
$('search').onclick=()=>{page=1;refresh()};$('favs').onchange=()=>{page=1;refresh()};$('prev').onclick=()=>{if(page>1){page--;refresh();}};$('next').onclick=()=>{page++;refresh();};$('token').addEventListener('change',reloadKind);
</script></main></body></html>
