<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nels TV — Décodeur</title><style>
*{box-sizing:border-box}body{margin:0;color:#ecf5ff;background:#070d16;font:16px system-ui}main{max-width:1350px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px}button,input{background:#243550;border:1px solid #57708c;border-radius:10px;color:white;padding:12px}button{cursor:pointer}button:focus-visible{outline:4px solid #70e7df}
.screen{overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,#121b31,#0b2837);border:1px solid #3a5871;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;position:relative}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}#banner{position:relative;background:#081321e8;padding:18px;border-left:5px solid #55c7d0;max-width:700px}
#banner strong{font-size:28px}#now{color:#b7d2e1;margin-top:8px}#status{position:absolute;top:20px;left:25px;color:#90bbca}
.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.controls button{font-weight:bold}
#guide{margin-top:25px}#guide li{margin:8px 0;padding:12px;background:#142438;border-radius:8px}
@media(max-width:700px){main{padding:12px}.screen{padding:14px}#banner strong{font-size:21px}}</style></head>
<body><main><header><h1>NELS TV <small>· Décodeur</small></h1><span><a href="/lineup.html" style="color:#7cd4e3">Organiser les chaînes</a> · <a href="/player.html" style="color:#7cd4e3">Lecteur HLS expérimental</a></span></header>
<label>Jeton local <input id="token" type="password" autocomplete="off"></label><button id="load">Ouvrir le bouquet</button>
<div class="screen"><video id="video" playsinline controls aria-label="Chaîne en direct"></video><p id="status">Choisis une chaîne pour commencer</p><div id="banner"><div id="number">—</div><strong id="name">Aucune chaîne</strong><div id="now">Sélectionne une chaîne</div></div></div>
<div class="controls"><button id="previous" aria-label="Chaîne précédente">CH −</button><button id="next" aria-label="Chaîne suivante">CH +</button><button id="guideButton">Guide TV</button><span id="info">Utilise ↑ ↓ pour zapper</span></div><div id="guide"><h2>Programmes</h2><ul id="programmes"></ul></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);let channels=[],index=0,hls=null,playingId=null,requestId=0;
async function get(path){let r=await fetch('/api/'+path,{headers:{'X-Admin-Token':$('token').value}});let data=await r.json();if(!r.ok)throw Error(data.error||'Erreur');return data;}
function render(){let c=channels[index];if(!c)return;playChannel(c);$('number').textContent=c.channel_number??'—';$('name').textContent=c.name;$('now').textContent=c.group_name||'Télévision en direct';$('programmes').replaceChildren();loadGuide();}
function stopPlayer(){if(hls){hls.destroy();hls=null;}$('video').pause();$('video').removeAttribute('src');$('video').load();}
async function playChannel(channel){
 const ticket=++requestId;playingId=channel.id;stopPlayer();$('status').textContent='Connexion à '+channel.name+'…';
 try {
  const response=await fetch('/api/playback/channel/'+channel.id+'/session',{method:'POST',headers:{'X-Admin-Token':$('token').value}});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Session impossible');
  if(ticket!==requestId)return;
  const video=$('video');
  if(window.Hls&&Hls.isSupported()){
   hls=new Hls({maxBufferLength:20,backBufferLength:10});
   hls.on(Hls.Events.ERROR,(_,error)=>{if(error.fatal&&ticket===requestId){const code=error.response?.code;const detail=code?'HTTP '+code+' · ':'';$('status').textContent='Erreur HLS : '+detail+error.details+' (flux ou codec incompatible)';}});
   hls.on(Hls.Events.MANIFEST_PARSED,async()=>{if(ticket===requestId){try{await video.play();}catch{$('status').textContent='Clique sur Lecture pour démarrer';}}});
   hls.loadSource(data.url);hls.attachMedia(video);
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
   video.src=data.url;
   try{await video.play();}catch(error){throw Error('Lecture HLS native impossible : '+error.message);}
  }else throw Error('Moteur HLS indisponible : vérifie le chargement de hls.js ou essaie un autre navigateur.');
  if(ticket===requestId)$('status').textContent='Connexion HLS à '+channel.name+'…';
 }catch(e){if(ticket===requestId)$('status').textContent='Lecture indisponible : '+e.message;}
}
$('video').addEventListener('playing',()=>{$('status').textContent='EN DIRECT';});
async function loadGuide(){let c=channels[index];if(!c)return;const selected=c.id;try{let d=await get('epg/channel/'+selected);if(channels[index]?.id!==selected)return;$('programmes').replaceChildren();if(!d.items.length)$('now').textContent='Aucun programme EPG associé';for(let p of d.items){let li=document.createElement('li');li.textContent=new Date(p.starts_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' — '+p.title;$('programmes').append(li);}const current=d.items.find(p=>new Date(p.starts_at)<=new Date()&&new Date(p.ends_at)>new Date());if(current)$('now').textContent=current.title;}catch(e){$('info').textContent=e.message;}}
async function load(){try{channels=[];for(let page=1;page<=10;page++){let d=await get('lineup?page='+page+'&limit=100');channels.push(...d.items);if(d.items.length<100)break;}index=0;render();$('info').textContent=channels.length+' chaînes chargées (max. 1000)';}catch(e){$('info').textContent=e.message;}}
function zap(step){if(!channels.length)return;index=(index+step+channels.length)%channels.length;render();}
$('load').onclick=load;$('previous').onclick=()=>zap(-1);$('next').onclick=()=>zap(1);$('guideButton').onclick=loadGuide;
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(e.key==='ArrowUp'){e.preventDefault();zap(-1)}if(e.key==='ArrowDown'){e.preventDefault();zap(1)}});
window.addEventListener('pagehide',stopPlayer);
</script></main></body></html>
