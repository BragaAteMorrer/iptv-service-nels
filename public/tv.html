<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nels TV — Décodeur</title><style>
*{box-sizing:border-box}body{margin:0;color:#ecf5ff;background:#070d16;font:16px system-ui}main{max-width:1350px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px}button,input{background:#243550;border:1px solid #57708c;border-radius:10px;color:white;padding:12px}button{cursor:pointer}button:focus-visible{outline:4px solid #70e7df}
.screen{overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,#121b31,#0b2837);border:1px solid #3a5871;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;position:relative}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}#banner{position:relative;background:#081321e8;padding:18px;border-left:5px solid #55c7d0;max-width:700px}
#banner strong{font-size:28px}#now{color:#b7d2e1;margin-top:8px}#status{position:absolute;top:20px;left:25px;color:#90bbca}
.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.controls button{font-weight:bold}
#navigation{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}#navigation input{min-width:150px}#search{flex:1;min-width:200px}#matches{color:#b7d2e1}#guide{margin-top:25px}#guide li{margin:8px 0;padding:12px;background:#142438;border-radius:8px}
@media(max-width:700px){main{padding:12px}.screen{padding:14px}#banner strong{font-size:21px}}</style></head>
<body><main><header><h1>NELS TV <small>· Décodeur</small></h1><span><a href="/lineup.html" style="color:#7cd4e3">Organiser les chaînes</a> · <a href="/player.html" style="color:#7cd4e3">Lecteur HLS expérimental</a></span></header>
<div class="controls"><label>E-mail <input id="email" type="email" autocomplete="username"></label><label>Mot de passe <input id="password" type="password" autocomplete="current-password"></label><button id="login">Connexion Nels TV</button></div>
<details><summary>Accès administrateur local (ancien mode)</summary><label>Jeton local <input id="token" type="password" autocomplete="off"></label></details><button id="load">Ouvrir le bouquet</button>
<div id="navigation"><label>Rechercher <input id="search" type="search" placeholder="Nom ou catégorie" aria-label="Rechercher une chaîne"></label><label>Numéro <input id="channelNumber" type="number" min="1" max="99999" placeholder="Ex. 12" aria-label="Numéro de chaîne"></label><button id="goNumber">Aller</button><button id="favoritesOnly" type="button" aria-pressed="false">☆ Toutes les chaînes</button><span id="matches" role="status"></span></div>
<div class="screen"><video id="video" playsinline controls aria-label="Chaîne en direct"></video><p id="status">Choisis une chaîne pour commencer</p><div id="banner"><div id="number">—</div><strong id="name">Aucune chaîne</strong><div id="now">Sélectionne une chaîne</div></div></div>
<div class="controls"><button id="previous" aria-label="Chaîne précédente">CH −</button><button id="next" aria-label="Chaîne suivante">CH +</button><button id="guideButton">Guide TV</button><span id="info">Utilise ↑ ↓ pour zapper</span></div><div id="guide"><h2>Programmes</h2><ul id="programmes"></ul></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);let channels=[],index=0,hls=null,playingId=null,requestId=0,userToken='',favoritesOnly=false;
function authHeaders(){return userToken?{'Authorization':'Bearer '+userToken}:{'X-Admin-Token':$('token').value};}
async function get(path){let r=await fetch('/api/'+path,{headers:authHeaders()});let data=await r.json();if(!r.ok)throw Error(data.error||'Erreur');return data;}
function isFavorite(c){return c.favorite===true||c.favorite===1||c.favorite==='1';}
function matchingIndices(){const query=$('search').value.trim().toLocaleLowerCase('fr');return channels.map((c,i)=>({c,i})).filter(({c})=>(!favoritesOnly||isFavorite(c))&&(!query||(c.name+' '+(c.group_name||'')+' '+(c.channel_number??'')).toLocaleLowerCase('fr').includes(query))).map(({i})=>i);}
function updateMatches(){const matches=matchingIndices();$('matches').textContent=matches.length+' / '+channels.length+' chaînes';return matches;}
function render(){let c=channels[index];if(!c)return;try{localStorage.setItem('nels-tv-last-channel',String(c.id));}catch{}updateMatches();playChannel(c);$('number').textContent=c.channel_number??'—';$('name').textContent=c.name;$('now').textContent=c.group_name||'Télévision en direct';$('programmes').replaceChildren();loadGuide();}
function stopPlayer(){if(hls){hls.destroy();hls=null;}$('video').pause();$('video').removeAttribute('src');$('video').load();}
async function playChannel(channel){
 const ticket=++requestId;playingId=channel.id;stopPlayer();$('status').textContent='Connexion à '+channel.name+'…';
 try {
  const response=await fetch('/api/playback/channel/'+channel.id+'/session',{method:'POST',headers:authHeaders()});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Session impossible');
  if(ticket!==requestId)return;
  const video=$('video');
  if(window.Hls&&Hls.isSupported()){
   hls=new Hls({maxBufferLength:20,backBufferLength:10});
   hls.on(Hls.Events.ERROR,(_,error)=>{if(error.fatal&&ticket===requestId){const code=error.response?.code;const detail=code?'HTTP '+code+' · ':'';$('status').textContent='Échec du chargement HLS : '+detail+error.details+'. Vérifie le format disponible auprès du fournisseur.';}});
   hls.on(Hls.Events.MANIFEST_PARSED,async()=>{if(ticket===requestId){try{await video.play();}catch{$('status').textContent='Clique sur Lecture pour démarrer';}}});
   hls.loadSource(data.url);hls.attachMedia(video);
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
   video.src=data.url;
   try{await video.play();}catch(error){throw Error('Lecture HLS native impossible : '+error.message);}
  }else throw Error('Moteur HLS indisponible : vérifie le chargement de hls.js ou essaie un autre navigateur.');
  if(ticket===requestId)$('status').textContent='Connexion HLS à '+channel.name+'…';
 }catch(e){if(ticket===requestId)$('status').textContent='Lecture indisponible : '+e.message;}
}
$('video').addEventListener('playing',()=>{$('status').textContent='EN DIRECT';});
async function loadGuide(){let c=channels[index];if(!c)return;const selected=c.id;try{let d=await get('epg/channel/'+selected);if(channels[index]?.id!==selected)return;$('programmes').replaceChildren();if(!d.items.length)$('now').textContent='Aucun programme EPG associé';for(let p of d.items){let li=document.createElement('li');li.textContent=new Date(p.starts_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' — '+p.title;$('programmes').append(li);}const current=d.items.find(p=>new Date(p.starts_at)<=new Date()&&new Date(p.ends_at)>new Date());if(current)$('now').textContent=current.title;}catch(e){$('info').textContent=e.message;}}
async function load(){try{channels=[];for(let page=1;page<=10;page++){let d=await get('lineup?page='+page+'&limit=100');channels.push(...d.items);if(d.items.length<100)break;}let last=null;try{last=localStorage.getItem('nels-tv-last-channel');}catch{}const lastIndex=channels.findIndex(c=>String(c.id)===last);index=lastIndex>=0?lastIndex:0;if(channels.length)render();else{stopPlayer();$('name').textContent='Aucune chaîne disponible';}updateMatches();$('info').textContent=channels.length+' chaînes chargées (max. 1000)';}catch(e){$('info').textContent=e.message;}}
function zap(step){const matches=updateMatches();if(!matches.length){$('info').textContent='Aucune chaîne correspondante';return;}const position=matches.indexOf(index);index=matches[(position+step+matches.length)%matches.length];render();}
function selectFirstMatch(){const matches=updateMatches();if(!matches.length){$('info').textContent='Aucune chaîne correspondante';return;}index=matches[0];render();}
function selectNumber(){const number=Number($('channelNumber').value);if(!Number.isSafeInteger(number)||number<1){$('info').textContent='Entre un numéro de chaîne valide';return;}const found=channels.findIndex(c=>Number(c.channel_number)===number&&c.channel_number!==null);if(found<0){$('info').textContent='Numéro '+number+' introuvable dans le bouquet chargé';return;}index=found;$('search').value='';favoritesOnly=false;$('favoritesOnly').setAttribute('aria-pressed','false');$('favoritesOnly').textContent='☆ Toutes les chaînes';render();}
$('login').onclick=async()=>{try{const r=await fetch('/api/identity/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Connexion impossible');userToken=d.access_token;$('password').value='';$('info').textContent='Compte connecté';await load();}catch(e){$('info').textContent=e.message;}};
$('load').onclick=load;$('search').addEventListener('input',()=>{updateMatches();});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectFirstMatch();}});$('goNumber').onclick=selectNumber;$('channelNumber').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectNumber();}});$('favoritesOnly').onclick=()=>{favoritesOnly=!favoritesOnly;$('favoritesOnly').setAttribute('aria-pressed',String(favoritesOnly));$('favoritesOnly').textContent=favoritesOnly?'★ Favoris uniquement':'☆ Toutes les chaînes';const matches=updateMatches();if(matches.length&&!matches.includes(index)){index=matches[0];render();}};$('previous').onclick=()=>zap(-1);$('next').onclick=()=>zap(1);$('guideButton').onclick=loadGuide;
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target instanceof HTMLSelectElement)return;if(e.key==='ArrowUp'){e.preventDefault();zap(-1)}if(e.key==='ArrowDown'){e.preventDefault();zap(1)}});
window.addEventListener('pagehide',stopPlayer);
</script></main></body></html>
