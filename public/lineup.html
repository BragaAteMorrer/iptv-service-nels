<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nels TV · Mes chaînes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101826;color:#eef5ff;font:15px system-ui}header{background:#1b2940;padding:22px 5%}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0}a{color:#8ad9f2}input,button{background:#263a52;color:white;border:1px solid #53667d;border-radius:8px;padding:9px}button{cursor:pointer}.channel{display:grid;grid-template-columns:65px 1fr auto auto auto;align-items:center;gap:12px;background:#1d2b40;border-radius:10px;padding:12px;margin:8px 0}.channel strong{overflow-wrap:anywhere}.number{width:65px}#message{color:#b4dceb}label{display:inline-flex;align-items:center;gap:7px}input[type=checkbox]{accent-color:#5abfd1}@media(max-width:650px){.channel{grid-template-columns:65px 1fr;}.channel button{grid-column:2}}</style></head>
<body><header><h1>Nels TV · Organisation des chaînes</h1><a href="/catalog.html">Catalogue</a></header><main>
<p>Modifie tes numéros, favoris et chaînes masquées. Les sources IPTV ne sont pas modifiées.</p>
<label>Jeton admin <input id="token" type="password" autocomplete="off"></label>
<button id="load">Charger</button> <label><input type="checkbox" id="hidden">Afficher les chaînes masquées</label>
<p id="message" role="status"></p><div id="channels"></div><button id="prev">Précédent</button> <span id="page"></span> <button id="next">Suivant</button>
<script>
const $=id=>document.getElementById(id);let page=1;
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'X-Admin-Token':$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Erreur');return data;}
async function load(){try{
let data=await api('lineup?page='+page+'&include_hidden='+($('hidden').checked?'1':'0'));$('channels').replaceChildren();
for(const item of data.items){
let row=document.createElement('div');row.className='channel';
let number=document.createElement('input');number.className='number';number.type='number';number.min=1;number.max=99999;number.placeholder='N°';number.value=item.channel_number??'';
let title=document.createElement('strong');title.textContent=item.name;
let fav=document.createElement('label');let star=document.createElement('input');star.type='checkbox';star.checked=item.favorite===true||item.favorite==='1';fav.append(star,document.createTextNode('Favori'));
let hide=document.createElement('label');let cb=document.createElement('input');cb.type='checkbox';cb.checked=item.hidden===true||item.hidden==='1';hide.append(cb,document.createTextNode('Masquer'));
let save=document.createElement('button');save.textContent='Enregistrer';save.onclick=async()=>{try{let n=number.value.trim();await api('lineup/'+item.id+'/preferences','PATCH',{channel_number:n===''?null:Number(n),favorite:star.checked,hidden:cb.checked});$('message').textContent='Chaîne enregistrée : '+item.name;}catch(e){$('message').textContent=e.message;}};
row.append(number,title,fav,hide,save);$('channels').append(row);}
$('page').textContent='Page '+page;$('prev').disabled=page===1;$('next').disabled=data.items.length<50;$('message').textContent=data.items.length+' chaînes affichées';
}catch(e){$('message').textContent=e.message;}}
$('load').onclick=()=>{page=1;load()};$('hidden').onchange=()=>{page=1;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{page++;load()};
</script></main></body></html>
