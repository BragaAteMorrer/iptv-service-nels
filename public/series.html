<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nels TV — Séries</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0e1625;color:#f3f6fc;margin:0;font:16px system-ui,-apple-system,sans-serif}header{background:#19283e;padding:20px max(24px,5vw);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:25px;margin:0}h2{margin:0 0 14px}a{color:#88d7ee}main{max-width:1250px;margin:auto;padding:26px 20px}
button,input,select{background:#213550;color:#fff;border:1px solid #4c6581;border-radius:8px;padding:11px;font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #80dbea;outline-offset:2px}button:hover{background:#315473}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.controls input{min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{background:#1a2a42;border:1px solid #344a68;border-radius:12px;padding:12px;cursor:pointer;text-align:left;min-height:225px}.tile img{display:block;width:100%;height:195px;object-fit:contain;background:#101d2d;border-radius:8px;margin-bottom:10px}
.tile strong,.tile small{display:block;overflow-wrap:anywhere}.tile small{color:#b6c5d8;margin-top:5px}.panel{background:#19283e;border:1px solid #354b68;border-radius:14px;padding:20px}
#detail{display:none}#detail.open{display:block}#episodes{display:grid;gap:9px;margin-top:14px}.episode{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%}.muted{color:#b5c7da}
#pager{display:flex;gap:14px;align-items:center;margin-top:20px}.hero{display:flex;gap:18px;align-items:flex-start}.hero img{width:130px;max-height:190px;object-fit:contain}.hero div{flex:1}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile img{height:150px}.hero{display:block}}
</style></head><body>
<header><h1>Nels TV · Séries</h1><nav><a href="/catalog.html">Catalogue</a> · <a href="/tv.html">TV en direct</a></nav></header>
<main>
<div id="auth" class="panel">
<h2>Connexion Nels TV</h2>
<div class="controls"><input id="email" type="email" autocomplete="username" placeholder="E-mail"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button id="login">Se connecter</button></div>
</div>
<p id="status" role="status" class="muted">Connecte-toi pour consulter tes séries.</p>
<section id="browse" hidden>
<div class="controls"><input id="search" type="search" placeholder="Rechercher une série"><button id="find">Rechercher</button></div>
<div id="tiles" class="grid"></div>
<div id="pager"><button id="prev">Précédent</button><span id="count"></span><button id="next">Suivant</button></div>
</section>
<section id="detail" class="panel" aria-label="Fiche série">
<button id="back">← Retour aux séries</button>
<div id="hero" class="hero"></div>
<label for="season">Saison</label> <select id="season"></select>
<div id="episodes"></div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let token='',page=1,limit=30,total=0,requestId=0,allEpisodes=[];
function status(s){$('status').textContent=s;}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'Erreur HTTP '+r.status);return data;}
function poster(url){if(!/^https:\/\//i.test(url||''))return null;const img=document.createElement('img');img.src=url;img.loading='lazy';img.referrerPolicy='no-referrer';img.alt='';return img;}
$('login').onclick=async()=>{try{const r=await fetch('/api/identity/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Connexion impossible');token=data.access_token;$('password').value='';$('auth').hidden=true;$('browse').hidden=false;await load();}catch(e){status(e.message);}};
async function load(){const serial=++requestId;try{status('Chargement des séries…');const params=new URLSearchParams({page,limit,q:$('search').value});const data=await api('/api/v1/vod/indexed-series?'+params);if(serial!==requestId)return;total=data.total;$('tiles').replaceChildren();for(const item of data.items){const button=document.createElement('button');button.className='tile';const img=poster(item.cover);if(img)button.append(img);const title=document.createElement('strong');title.textContent=item.title;const meta=document.createElement('small');meta.textContent=item.genre||'Série';button.append(title,meta);button.onclick=()=>show(item.id);$('tiles').append(button);}
$('count').textContent='Page '+page+' / '+Math.max(1,Math.ceil(total/limit));$('prev').disabled=page===1;$('next').disabled=page*limit>=total;status(total+' séries disponibles'+(total===0?' — synchronise d’abord les données Xtream.':''));}catch(e){status('Catalogue : '+e.message);}}
async function show(id){try{status('Chargement de la fiche…');const data=await api('/api/v1/vod/indexed-series/'+id);$('browse').hidden=true;$('detail').classList.add('open');$('hero').replaceChildren();const img=poster(data.series.cover);if(img)$('hero').append(img);const description=document.createElement('div');const title=document.createElement('h2');title.textContent=data.series.title;const synopsis=document.createElement('p');synopsis.textContent=data.series.synopsis||'Aucun synopsis fourni par le diffuseur.';description.append(title,synopsis);$('hero').append(description);allEpisodes=data.episodes;$('season').replaceChildren();const seasons=[...new Set(allEpisodes.map(e=>Number(e.season_number)))].sort((a,b)=>a-b);for(const season of seasons)$('season').add(new Option('Saison '+season,String(season)));$('season').disabled=!seasons.length;renderEpisodes();status(allEpisodes.length+' épisodes référencés'+(data.truncated?' (fiche partielle)':''));}catch(e){status('Fiche : '+e.message);}}
function renderEpisodes(){$('episodes').replaceChildren();const season=Number($('season').value);for(const item of allEpisodes.filter(x=>Number(x.season_number)===season)){const el=document.createElement('div');el.className='episode panel';const text=document.createElement('div');const strong=document.createElement('strong');strong.textContent='Épisode '+item.episode_number+' · '+item.title;const small=document.createElement('div');small.className='muted';const pos=Number(item.position_seconds||0),dur=Number(item.duration_seconds||0);small.textContent=pos>0?'Reprise : '+Math.floor(pos/60)+' min'+(dur?' / '+Math.floor(dur/60)+' min':''):'Non commencé';text.append(strong,small);el.append(text);if(Number(item.position_seconds||0)>0){const resume=document.createElement('button');resume.textContent='Reprise enregistrée';resume.title='La lecture VOD sera disponible après intégration MP4/HLS';resume.disabled=true;el.append(resume);}$('episodes').append(el);}if(!$('episodes').children.length)$('episodes').textContent='Aucun épisode importé pour cette série.';}
$('season').onchange=renderEpisodes;$('back').onclick=()=>{$('detail').classList.remove('open');$('browse').hidden=false;status('Catalogue des séries');};
$('find').onclick=()=>{page=1;load();};$('search').onkeydown=e=>{if(e.key==='Enter'){page=1;load();}};$('prev').onclick=()=>{if(page>1){page--;load();}};$('next').onclick=()=>{if(page*limit<total){page++;load();}};
</script></body></html>
