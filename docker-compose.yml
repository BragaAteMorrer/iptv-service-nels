services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET}"
      DATABASE_URL: "postgresql://iptv:iptv@database:5432/iptv?charset=utf8"
      IPTV_ADMIN_TOKEN: "${IPTV_ADMIN_TOKEN}"
      IPTV_SECRET_KEY: "${IPTV_SECRET_KEY}"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: iptv
      POSTGRES_DB: iptv
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U iptv -d iptv"]
      interval: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
